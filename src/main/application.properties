//application.properties

# ===============================
# ?? Nombre de la aplicación
# ===============================
spring.application.name=orders-api

# ===============================
# ? Configuración de servidor (ACCESIBLE EN RED)
# ===============================
# Escuchar en todas las interfaces de red para permitir conexiones remotas
server.address=0.0.0.0
server.port=8080

# ===============================
# ? Configuración de base de datos H2 persistente
# ===============================
# La base se guarda en ./data/ordersdb.mv.db (persistente entre ejecuciones)
spring.datasource.url=jdbc:h2:file:./data/ordersdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto de Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Crear/actualizar tablas automáticamente (sin borrar datos existentes)
spring.jpa.hibernate.ddl-auto=update

# Mostrar las consultas SQL en consola (opcional)
spring.jpa.show-sql=true

# ===============================
# ? Consola web de H2
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permitir que la consola H2 sea accedida desde otra máquina (IMPORTANTE)
spring.h2.console.settings.web-allow-others=true

# ===============================
# ? OAuth2 Google
# ===============================
# Recomendado: mover el client-secret a una variable de entorno
spring.security.oauth2.client.registration.google.client-id=968552378857-5mvuq40sh79kjsa0jakl5tsfllhnub6.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET: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}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

